<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Text & Sentiment Analyzer</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #f4f7f6; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; margin-top: 10px; }
        button:disabled { background: #6c757d; }
        .result-box { margin-top: 20px; padding: 15px; border-radius: 4px; background: #e9ecef; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2>AI Text & Sentiment Analyzer</h2>
        <textarea id="userInput" placeholder="Enter text to analyze..."></textarea>
        <br>
        <button id="analyzeBtn" onclick="processText()">Analyze Text</button>

        <div id="resultBox" class="result-box">
            <h3>Results:</h3>
            <p><strong>Sentiment:</strong> <span id="sentiment"></span> (<span id="confidence"></span>)</p>
            <p><strong>Summary:</strong></p>
            <p id="summaryText"></p>
        </div>
    </div>

    <script>
        async function processText() {
            const text = document.getElementById("userInput").value;
            const btn = document.getElementById("analyzeBtn");
            const resultBox = document.getElementById("resultBox");

            if (!text.trim()) return alert("Please enter some text!");

            btn.disabled = true;
            btn.innerText = "Processing AI Inference...";

            try {
                const response = await fetch("/analyze", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text })
                });
                
                const data = await response.json();

                if (response.ok) {
                    document.getElementById("sentiment").innerText = data.sentiment;
                    document.getElementById("confidence").innerText = data.confidence;
                    document.getElementById("summaryText").innerText = data.summary;
                    resultBox.style.display = "block";
                } else {
                    alert("Server Error: " + (data.error || "Failed to process text."));
                }
            } catch (err) {
                console.error(err);
                alert("Network error: Could not connect to backend server.");
            } finally {
                btn.disabled = false;
                btn.innerText = "Analyze Text";
            }
        }
    </script>
</body>
</html>
